[project]
name = "diction-bot"
version = "0.1.0"
description = "Telegram-бот для ежедневной тренировки дикции"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "APScheduler>=3.10,<4",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
